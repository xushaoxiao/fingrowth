name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/analyze.py examples/lending/cohorts.json
      - name: Check reproducible Markdown report
        run: |
          report_file="$(mktemp)"
          python scripts/analyze.py examples/lending/cohorts.json --format markdown > "$report_file"
          diff -u examples/lending/REPORT.md "$report_file"
      - name: Build reproducible release candidates
        run: |
          python scripts/build_release.py --output dist/one
          python scripts/build_release.py --output dist/two
          diff -ru dist/one dist/two
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Check and package the dashboard with its source
        run: python scripts/build_release.py --include-dashboard --output dist/full
